<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>freestack: copy your stack</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E7E9EC}
a{color:#1C2340;text-decoration-thickness:1px;text-underline-offset:3px}a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid #2F45E0;outline-offset:2px}
header :focus-visible,[role="region"] :focus-visible{outline-color:#FFD23F}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: #E7E9EC; color: #1C2340; font-family: Archivo, sans-serif">
  <header style="background: #1C2340; color: #FFFFFF">
    <nav aria-label="Main" style="max-width: 1240px; margin: 0 auto; padding: 12px 32px; display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(260px, 520px) minmax(max-content, 1fr); align-items: center; gap: 24px">
      <a href="Home.dc.html" style="justify-self: start; display: inline-flex; align-items: center; gap: 10px; color: #FFFFFF; text-decoration: none; font-weight: 900; font-stretch: 125%; font-size: 22px; letter-spacing: -0.01em"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 40 40"><path d="M2.5 20L11 7.5h26.5v25H11z" fill="#FFD23F"></path><circle cx="11.5" cy="20" r="2.8" fill="#1C2340"></circle><rect x="18" y="12.5" width="15" height="3.6" fill="#1C2340"></rect><rect x="18" y="18.2" width="11.5" height="3.6" fill="#1C2340"></rect><rect x="18" y="23.9" width="8" height="3.6" fill="#1C2340"></rect></svg>freestack</a>
      <button type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K /" aria-label="Search 222 tools" style="width: 100%; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; background: #FFFFFF; border: 0; color: #545B73; font: 500 15px Archivo, sans-serif; text-align: left; cursor: pointer">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#545B73" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span style="flex: 1">Search 222 tools</span>
        <span aria-hidden="true" style="display: inline-flex; gap: 4px"><kbd style="font: 600 12px Archivo, sans-serif; color: #1C2340; background: #E7E9EC; border-bottom: 2px solid #C9CDD4; padding: 2px 7px">Ctrl</kbd><kbd style="font: 600 12px Archivo, sans-serif; color: #1C2340; background: #E7E9EC; border-bottom: 2px solid #C9CDD4; padding: 2px 7px">K</kbd></span>
      </button>
      <div style="justify-self: end; display: flex; align-items: center; gap: 8px">
        <button type="button" aria-haspopup="true" aria-expanded="false" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; background: transparent; border: 0; color: #FFFFFF; font: 600 15px Archivo, sans-serif; cursor: pointer">Aisles<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
        <a href="AddTool.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 2px solid #FFFFFF; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 15px; box-sizing: border-box">Add a tool</a>
      </div>
    </nav>
  </header>
  <div aria-hidden="true" style="max-width: 1240px; margin: 0 auto; padding: 56px 32px"><p style="margin: 0; font-weight: 900; font-stretch: 62%; line-height: 1; font-size: 120px; max-width: 9ch">Pick a stack and start building.</p></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(28,35,64,0.55)"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="copy-h" style="position: absolute; top: 110px; left: 50%; width: 680px; margin-left: -340px; background: #FFFFFF; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5)">
    <div style="display: flex; align-items: center; gap: 12px; padding: 18px 12px 18px 24px; border-bottom: 2px solid #1C2340">
      <h2 id="copy-h" style="margin: 0; font-weight: 900; font-stretch: 62%; font-size: 40px; line-height: 1">Copy your stack</h2>
      <button type="button" aria-label="Close" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div role="tablist" aria-label="Format" style="display: flex; gap: 0; padding: 0 24px; border-bottom: 1px solid #C9CDD4">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
    <div role="tabpanel" style="padding: 20px 24px">
      <p style="margin: 0 0 10px; font-size: 15px; color: #545B73">{{hint}}</p>
      <pre style="margin: 0; padding: 16px 18px; background: #F3F4F6; border: 1px solid #C9CDD4; font: 500 15px/1.5 Archivo, sans-serif; white-space: pre-wrap; color: #1C2340">{{text}}</pre>
      <div style="margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <button type="button" onClick="{{copy}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; background: #1C2340; color: #FFFFFF; text-decoration: none; border: 0; font: 700 15px Archivo, sans-serif; cursor: pointer">{{btn}}</button>
        <span role="status" style="font-size: 15px; font-weight: 700">{{copied}}</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'md', copied: false }; }
  renderVals() {
    var self = this, cur = this.state.tab;
    var T = { md: { label: 'For your notes', hint: 'Markdown. Paste it into a README, Notion or your group chat.', text: "## My free stack (from freestack)\nFor: Student with school email\n\n- Hosting: Cloudflare Workers & Pages\n  100k requests a day\n- Database: Neon\n  0.5 GB storage. Catch: sleeps after 5 min idle\n- Sign-in: Clerk\n  50k monthly retained users\n- Secrets: Doppler (GitHub Student Pack)\n  Catch: ends when you graduate", btn: 'Copy text' },
      link: { label: 'Link', hint: 'Anyone with the link sees this stack with live limits.', text: "https://[your domain]/stack?for=student", btn: 'Copy link' },
      agent: { label: 'For your coding agent', hint: 'Paste into Claude Code, Cursor or Kiro before it scaffolds.', text: "Set up this project on these free tiers:\nCloudflare Workers & Pages for hosting, Neon for\nthe database, Clerk for sign-in, Doppler for secrets.\n\nKeep within the free limits. Neon sleeps after\n5 minutes idle, so warn me if anything needs it\nalways awake. Check freestack before adding any\npaid service.", btn: 'Copy prompt' } };
    var base = 'min-height: 48px; padding: 0 16px; background: transparent; border: 0; font: 700 15px Archivo, sans-serif; color: #1C2340; cursor: pointer; ';
    var tabs = ['md', 'link', 'agent'].map(function (k) { var on = k === cur; return { label: T[k].label, sel: on ? 'true' : 'false', style: base + (on ? 'box-shadow: inset 0 -4px 0 #1C2340' : 'color: #545B73'), pick: function () { self.setState({ tab: k, copied: false }); } }; });
    return { tabs: tabs, hint: T[cur].hint, text: T[cur].text, btn: T[cur].btn, copied: this.state.copied ? 'Copied' : '', copy: function () { self.setState({ copied: true }); } };
  }
}
</script>
</body>
</html>
