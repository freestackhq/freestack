# Preview deploy for each pull request: uploads a Worker version with a
# pr-<number> alias (no traffic moves to it) and comments its URL on the PR.
# Fork PRs get no secrets, so they are skipped. Absolute links inside the
# preview (share links, llms.txt, the MCP address) use SITE_URL, so they
# point at production.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLIC_GITHUB_REPO: ${{ vars.PUBLIC_GITHUB_REPO || github.repository }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Skip when Cloudflare is not configured
        id: configured
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Cloudflare secrets; preview skipped."
          fi
      - if: steps.configured.outputs.ok
        uses: actions/checkout@v7
      - if: steps.configured.outputs.ok
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - if: steps.configured.outputs.ok
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.configured.outputs.ok
        run: pnpm install --frozen-lockfile
      - if: steps.configured.outputs.ok
        run: pnpm build
      - if: steps.configured.outputs.ok
        name: Upload preview version
        id: upload
        run: |
          pnpm exec wrangler versions upload --preview-alias "$ALIAS" --message "PR #${{ github.event.pull_request.number }} ${GITHUB_SHA::7}" | tee upload.log
          url="$(grep -oE 'https://[^ ]*workers\.dev[^ ]*' upload.log | grep -- "$ALIAS" | head -1)"
          [ -n "$url" ] || url="$(grep -oE 'https://[^ ]*workers\.dev[^ ]*' upload.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - if: steps.configured.outputs.ok && steps.upload.outputs.url
        name: Comment the preview link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          body="Preview: $URL (commit ${GITHUB_SHA::7}). Updates on every push."
          gh pr comment "$PR" --edit-last --body "$body" 2>/dev/null || gh pr comment "$PR" --body "$body"
