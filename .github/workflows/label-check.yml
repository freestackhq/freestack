# Check a label issues (ARCHITECTURE.md "Trust loop"). The logic lives in
# scripts/trust/label-check.mjs; this file only runs it. Issue text is
# read from the event file by the script, never pasted into a shell here.
name: label-check

on:
  issues:
    types: [opened, edited, closed, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write # dispatch deploy.yml after a data commit (GITHUB_TOKEN pushes start no workflows)

jobs:
  process:
    # Issue-form issues carry the label; a pasted "too long" body carries the marker.
    # The form title ("Check: ") also counts: GitHub silently drops a form's label
    # when the repo label is missing. A later "label-check" label added by hand runs
    # only for issues that matched none of these (the opened run handled the rest).
    if: >-
      !github.event.issue.pull_request &&
      ((github.event.action != 'labeled' &&
        (contains(github.event.issue.labels.*.name, 'label-check') ||
         startsWith(github.event.issue.title, 'Check: ') ||
         contains(github.event.issue.body, '<!-- freestack:label-check -->'))) ||
       (github.event.action == 'labeled' &&
        github.event.label.name == 'label-check' &&
        !startsWith(github.event.issue.title, 'Check: ') &&
        !contains(github.event.issue.body, '<!-- freestack:label-check -->')))
    # Job-level, so skipped runs (other labels) never cancel a queued real one.
    concurrency:
      group: label-check-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The generator (run when data/ changes) needs the yaml and ajv packages.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Creates the repo label first if it is missing, so the add never fails.
      - name: Add the label to a pasted or unlabeled issue
        if: ${{ !contains(github.event.issue.labels.*.name, 'label-check') && github.event.action != 'closed' }}
        run: |
          gh label create label-check --color 0E8A16 --description "Check a label submissions" 2>/dev/null || true
          gh issue edit "$NUMBER" --add-label label-check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
      - run: node scripts/trust/label-check.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
