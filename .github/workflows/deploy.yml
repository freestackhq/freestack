# Production deploy to Cloudflare Workers on the domain in SITE_URL.
#
# Runs when CI passes on the default branch, when a trust-loop workflow
# dispatches it after a data commit (GITHUB_TOKEN pushes start no workflows),
# by hand, and once a day: label ages ("Checked 3 days ago", overdue) are
# computed at build time, so a daily build keeps them true.
#
# Needs, in the "production" environment or the repo:
#   secrets  CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID
#   vars     SITE_URL (required), PUBLIC_GITHUB_REPO, PUBLIC_CF_ANALYTICS_TOKEN (optional)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # From CI: only a green push run on the default branch. Schedule and
    # dispatch already run on the default branch.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      PUBLIC_GITHUB_REPO: ${{ vars.PUBLIC_GITHUB_REPO || github.repository }}
      PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          [ -n "$SITE_URL" ] || missing="$missing vars.SITE_URL"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing secrets.CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Deploy is not configured. Missing:$missing (see .github/workflows/deploy.yml)"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever landed since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The committed snapshot must match data/ (CI checks this too; a
      # dispatched data commit skipped CI).
      - name: Snapshot is up to date
        run: |
          pnpm catalog:generate
          git diff --exit-code -I '"generatedAt"' -- src/data/catalog.generated.json \
            || { echo "::error::src/data/catalog.generated.json is stale. Run pnpm catalog:generate and commit it."; exit 1; }
      - name: Plugin files match SITE_URL
        run: pnpm plugin:build --check
      - name: Build and deploy
        id: deploy
        run: pnpm deploy:cf
      - name: Smoke test
        # Probe the Worker's own *.workers.dev URL, not the custom domain.
        # The zone has Bot Fight Mode on, which blocks GitHub Actions runner
        # IPs (datacenter ASN) on the custom domain and returns 403 to curl.
        # Bot Fight Mode cannot be skipped with a WAF rule, but the workers.dev
        # route sits in front of the Worker directly and is not behind the
        # zone's bot protection, so the runner can reach it.
        #
        # deploy.mjs captures that URL from wrangler and exposes it as the
        # step output workers_dev_url. If it is missing for any reason, fall
        # back to the custom domain (which may 403 under Bot Fight Mode).
        #
        # A freshly created workers.dev subdomain needs a few minutes for DNS
        # and certificates; first probes read HTTP 000, so 000 is retried.
        # ~5 min total (15 tries, 20s apart).
        env:
          WORKERS_DEV_URL: ${{ steps.deploy.outputs.workers_dev_url }}
        run: |
          if [ -n "$WORKERS_DEV_URL" ]; then
            base="${WORKERS_DEV_URL%/}"
            echo "smoke: using workers.dev URL $base (bypasses Bot Fight Mode)"
          else
            base="${SITE_URL%/}"
            echo "::warning::no workers.dev URL captured; falling back to $base (Bot Fight Mode may 403 runner IPs)"
          fi
          url="$base/api/health"
          last=""
          for _ in $(seq 1 15); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
            last="$code"
            case "$code" in
              2*) echo "health ok ($code)"; exit 0 ;;
              000) echo "no answer yet (DNS/cert/connection), retrying..." ;;
              404|5*) echo "worker not ready yet (HTTP $code), retrying..." ;;
              *) echo "::error::$url returned HTTP $code"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::$url did not become healthy after deploy (last HTTP $last)"
          exit 1
