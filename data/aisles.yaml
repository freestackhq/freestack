# One headline metric per aisle. Every tool in the aisle shows this number.
# Each aisle measures what its tools actually list, so aisles that measure
# different things never share a metric (tests/unit/aisles.test.ts).
# A tool that lists its limit in another unit sets metric: null and puts the
# figure in metric_note.
#
# UI-only fields: noun (counts, "8 free databases"), types (filter chips,
# matched against tool.type), seeAlso (where related tools live), intro
# (Claim Once page lede).
#
# Order in this file is the order in menus and on Home.

# ---------- Build ----------
- id: databases
  group: Build
  name: Databases
  metric: storage_gb
  unit: GB
  label: free storage
  noun: databases
  types:
    - { id: postgres, label: Postgres }
    - { id: sqlite, label: SQLite }
    - { id: documents, label: Documents }
    - { id: analytics, label: Analytics }
  seeAlso: { text: "Redis and queues are in", aisle: cache, name: Cache and queues }
- id: cache
  group: Build
  name: Cache and queues
  metric: commands_per_day
  unit: a day
  label: commands
  noun: caches and queues
- id: hosting
  group: Build
  name: Sites and functions
  metric: bandwidth_gb_month   # static sites, serverless and edge functions list transfer
  unit: GB a month
  label: transfer
  noun: hosts
  seeAlso: { text: "Servers that stay up are in", aisle: servers, name: Always-on servers }
- id: servers
  group: Build
  name: Always-on servers
  metric: ram_gb               # VMs and containers that stay up (Koyeb, Render, Oracle) list memory
  unit: GB
  label: memory
  noun: servers
  seeAlso: { text: "Static sites and functions are in", aisle: hosting, name: Sites and functions }
- id: auth
  group: Build
  name: Auth and secrets
  metric: monthly_users
  unit: users a month
  label: monthly users
  noun: auth and secrets tools
- id: email
  group: Build
  name: Email
  metric: emails_per_day     # the email catalog lists daily send caps (Resend 100, Brevo 300)
  unit: a day
  label: emails
  noun: email services
  seeAlso: { text: "Form backends are in", aisle: forms, name: Forms }
- id: forms
  group: Build
  name: Forms
  metric: submissions_per_month   # Formspree lists submissions a month
  unit: a month
  label: submissions
  noun: form backends
- id: storage
  group: Build
  name: Storage
  metric: storage_gb
  unit: GB
  label: free storage
  noun: storage services
- id: jobs
  group: Build
  name: Jobs and automation
  metric: messages_per_month      # Svix lists messages a month; steps, events and daily caps go in metric_note
  unit: a month
  label: messages
  noun: job and automation tools
- id: observability
  group: Build
  name: Logs and monitoring
  metric: ingest_gb_month         # Axiom, New Relic and Better Stack list GB of data sent in a month
  unit: GB a month
  label: data in
  noun: monitoring tools
- id: search
  group: Build
  name: Search
  metric: records                 # none of these list a number yet
  unit: ""
  label: records
  noun: search services
- id: security
  group: Build
  name: Security
  metric: seats                   # Tailscale lists users; most list nothing
  unit: ""
  label: free seats
  noun: security tools
- id: design
  group: Build
  name: Design
  metric: seats
  unit: ""
  label: free seats
  noun: design tools
- id: team
  group: Build
  name: Team and ops
  metric: seats
  unit: ""
  label: free seats
  noun: team tools

