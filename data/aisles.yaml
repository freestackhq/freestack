# One headline metric per aisle. Every tool in the aisle shows this number.
# Each aisle measures what its tools actually list, so aisles that measure
# different things never share a metric.
- id: databases
  group: Build
  name: Databases
  metric: storage_gb
  unit: GB
  label: free storage
- id: cache
  group: Build
  name: Cache and queues
  metric: commands_per_day
  unit: a day
  label: commands
- id: hosting
  group: Build
  name: Sites and functions
  metric: bandwidth_gb_month   # static sites, serverless and edge functions list transfer
  unit: GB a month
  label: transfer
- id: servers
  group: Build
  name: Always-on servers
  metric: ram_gb               # VMs and containers that stay up (Koyeb, Render, Oracle) list memory
  unit: GB
  label: memory
- id: auth
  group: Build
  name: Auth and secrets
  metric: monthly_users
  unit: users a month
  label: monthly users
- id: email
  group: Build
  name: Email
  metric: emails_per_day     # the email catalog lists daily send caps (Resend 100, Brevo 300)
  unit: a day
  label: emails
- id: storage
  group: Build
  name: Storage
  metric: storage_gb
  unit: GB
  label: free storage
- id: inference
  group: AI
  name: Inference APIs
  metric: requests_per_day   # providers that list only tokens get null and a metric_note
  unit: a day
  label: requests
- id: student
  group: Claim Once
  name: Student programs
  metric: duration
  unit: ""
  label: how long it lasts
