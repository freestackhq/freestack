- slug: can-i-sell-on-vercel-hobby
  aisle: hosting
  tool: vercel-hobby
  question: Can I sell things on Vercel Hobby?
  answer: No.
  detail: Hobby is for personal projects only. Anything that makes money for anyone needs a paid plan.
  includes:
