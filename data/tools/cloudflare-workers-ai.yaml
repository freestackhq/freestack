cost: free
catches: []
use_if:
  - "Your app already runs on Cloudflare Workers and you want inference co-located at the edge with zero cold starts, paying nothing up to 10 K neurons/day. vs Together AI / Fireworks: Workers AI runs *inside* your request pipeline (no external HTTP hop), but model selection is smaller and weights are quantized for edge hardware. vs Replicate: Workers AI is for lightweight, latency-first inference at the edge; Replicate is for heavier GPU models (image gen, voice) where you can tolerate ~2 s cold starts."
  - Your app is already on Cloudflare Workers and you want AI inference with zero extra infra.
skip_if:
  - reason: Slower inference but integrated into Cloudflare edge; no separate billing. Groq is faster but requires separate API management.
    use: groq
pricing_url: https://developers.cloudflare.com/workers-ai/
verified_at: null
verified_by: null
source: catalog
tagline: Edge inference next to your Workers — tiny models, low ops.
about: |-
  Edge inference next to your Workers — tiny models, low ops.

  Run inference at the edge alongside your Cloudflare Workers. No cold starts for AI if your app is already on Workers. 10k neurons/day free, then usage-based. Good for adding AI features to existing Workers apps.
tags:
  - llm
  - edge
api:
  base_url: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1/openai
  docs: https://developers.cloudflare.com/workers-ai
  auth: api-key (CF API token)
  models: "@cf/meta/llama-4-scout-17b-16e-instruct, Mistral, Phi, Gemma variants"
  openai_compatible: yes
  streaming: yes
  self_host: no
