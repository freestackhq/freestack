use_if:
  - "You want zero-cost, fully private inference on your own hardware — no API keys, no rate limits, no data leaving your machine — and you're fine with open-weight model quality. vs Groq: Ollama is truly free with no quotas but limited by your local GPU; Groq is faster and runs larger models but has rate limits and requires internet. vs LM Studio: Ollama is CLI-first and daemon-based (great for scripts, CI, and server use); LM Studio adds a GUI for model browsing and chat — use both together."
  - You want the easiest path to local LLMs with zero configuration and OpenAI SDK compatibility.
skip_if:
  - reason: Ollama is CLI-first and scriptable; LM Studio is GUI-first with a nice chat interface. Both expose the same OpenAI-compatible server.
