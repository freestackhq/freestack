use_if:
  - You want a zero-JS form endpoint you can drop into any HTML page with a simple `action=` URL — no build step, no SDK, no client-side code required. The 50 submissions/mo free cap is tight, so this fits low-traffic pages like a portfolio contact form or an internal feedback widget.
skip_if:
  - reason: Formspree is a raw HTTP endpoint (you own the HTML); Tally is a hosted form builder (you embed their UI). Pick Formspree when you want pixel-perfect form styling. vs Formspark — nearly identical concept; Formspree has a slightly richer plugin/integration layer, Formspark is simpler and cheaper at paid tiers.
