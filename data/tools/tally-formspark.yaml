use_if:
  - You need a contact form, waitlist signup, or feedback widget on a static site or landing page and refuse to spin up an API just to receive a POST. Tally gives you a Notion-like form builder with unlimited submissions on free; Formspark is a minimal `<form action>` endpoint if you want full HTML control.
skip_if:
