use_if:
  - You need general-purpose object storage and refuse to pay egress taxes — especially if you're already on Cloudflare Workers or Pages. The 10 GB free tier plus zero egress makes it the default choice for any project that serves files to users.
skip_if:
  - reason: R2 gives you zero egress natively; B2 only waives egress if you route through Cloudflare CDN. R2 also has tighter Workers integration (bindings, no auth overhead). Pick B2 only for cold archive you rarely read.
    use: backblaze-b2
  - reason: Both are S3-compatible, but R2 is battle-tested at Cloudflare scale with richer ecosystem tooling. Tigris wins if your compute lives on Fly and you want automatic edge replication without CDN config.
    use: tigris
