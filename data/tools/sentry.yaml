use_if:
  - Your app ships JS/TS bundles and you need stack traces that point to *your* source lines, not minified garbage. The 5k errors/mo free tier covers side projects; the GitHub Student Pack bumps you to ~50k + Team features for serious staging environments.
skip_if:
  - reason: PostHog shows what users *did*; Sentry shows what *broke*. Install both — they complement, not compete.
    use: posthog
  - reason: Better Stack alerts you the endpoint is down; Sentry tells you the exact unhandled promise rejection on line 42 that caused it.
    use: better-stack
