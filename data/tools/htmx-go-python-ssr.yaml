use_if:
  - "Your app is CRUD-heavy (dashboards, admin panels, internal tools) and you'd rather ship features than fight React hydration, bundle splitting, and state management. HTMX gives you dynamic UI with server-rendered HTML — no build step, no node_modules, no client-side router. Pair with Go (fast, single binary) or Python/Django (fast iteration, batteries included). vs Next.js/React SPA: SPAs win when you need rich offline interactions, real-time collaborative editing, or complex client state (Figma, Notion). For 80% of B2B SaaS, HTMX + SSR is faster to build, faster to load, and cheaper to host. vs Laravel/Rails: same philosophy (server-rendered, productive) — pick Go/Python HTMX if you want lighter deployments (single binary or container) without a full framework's opinions."
