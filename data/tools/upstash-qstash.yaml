use_if:
  - "You just need a reliable HTTP message queue to wake serverless endpoints on a schedule or after an event — no SDK lock-in, no runtime to deploy. QStash is the lightest option here: POST a message, it delivers with retries and delay. Ideal for Vercel/Cloudflare apps that can't hold open connections (500 msg/day free)."
skip_if:
  - reason: QStash is a dumb pipe (deliver this HTTP request later with retries); Inngest is a smart orchestrator (run this multi-step function). Pick QStash when your logic already lives in an endpoint and you just need guaranteed delivery; pick Inngest when you need step-level state, fan-out, or cron built in.
    use: inngest
