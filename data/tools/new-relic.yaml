use_if:
  - You want distributed traces, APM dashboards, and logs in one platform with ~100 GB/mo free ingest — enough to observe a multi-service backend end-to-end. The Student Pack may unlock extra capacity. Best for when you've outgrown "just logs" and need flame graphs, service maps, and SLI/SLO tracking.
skip_if:
  - reason: Axiom is leaner and faster for pure log queries; New Relic is heavier but gives you traces, metrics, and dashboards you'd otherwise build yourself.
    use: axiom
  - reason: Sentry is laser-focused on *errors*; New Relic gives you the full request lifecycle (latency, throughput, saturation) even when nothing is crashing.
    use: sentry
