use_if:
  - You need real-time change-data-capture from Postgres without bolting on Kafka + Debezium — Sequin gives you ordered, exactly-once streams from your existing tables with one connection string.
skip_if:
  - reason: "Debezium/Kafka: Sequin is dramatically simpler to operate (no Zookeeper, no Connect cluster) and purpose-built for Postgres; Debezium is the choice only if you also need MySQL/Mongo CDC or already run Kafka. vs LISTEN/NOTIFY: Postgres NOTIFY drops messages under load and has a payload size limit; Sequin gives you durable, replayable streams with backpressure."
