use_if:
  - "You want a European AI provider with a massive free Experiment tier (~1 B tokens/month), strong coding models (Codestral), and both open-weight and proprietary options — good for EU data residency requirements. vs Groq: Mistral's free tier has far higher token limits; Groq is faster but with stricter rate limits. Mistral also offers its own proprietary models (Large, Medium) not available elsewhere. vs OpenAI API: Mistral is significantly cheaper (PAYG from $0.10/MTok vs $2.50+) with competitive quality on many tasks; OpenAI wins on frontier reasoning benchmarks."
  - You want a strong small model (Nemo 12B) with good instruction following and structured output.
skip_if:
  - reason: Smaller models, more predictable outputs for structured tasks; Gemini is more capable but heavier.
