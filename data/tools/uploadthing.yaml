use_if:
  - You're building a Next.js app and want file uploads working in under 30 minutes with zero infra config — presigned URLs, progress callbacks, type-safe routes, and a dashboard included. The 2 GB free tier is tight but perfect for MVPs and prototypes.
skip_if:
  - reason: R2 gives you raw S3 buckets — you'll wire presigned URLs and client uploaders yourself. UploadThing is a managed upload layer with built-in UI components and callbacks. Pick R2 when you outgrow 2 GB or need full control; pick UploadThing when speed-to-ship matters more.
    use: r2
  - reason: Cloudinary transforms media after upload; UploadThing just stores and serves files. If you need resizing, cropping, or format conversion, Cloudinary is the tool. If you just need "user uploads a file, app stores it," UploadThing is simpler.
    use: cloudinary
