use_if:
  - "You already run Postgres (Neon, Supabase, RDS) and want vector search without adding another service — your embeddings live in the same DB as your app data, with transactions and joins for free. vs Pinecone/Qdrant: pgvector avoids a new dependency and bill; dedicated vector DBs outperform it past ~1 M vectors or when you need advanced indexing (IVF-PQ, DiskANN). vs Chroma: pgvector keeps everything in one database you already operate; Chroma is better for rapid local prototyping when you don't have Postgres set up yet."
