use_if:
  - You want a Firebase-like all-in-one platform (auth, database, functions, storage) that's fully open-source and self-hostable — giving you an exit door that proprietary BaaS platforms don't offer.
skip_if:
  - reason: Both are open-source BaaS. Pick Supabase when you want real Postgres and SQL power. Pick Appwrite when you prefer a document-style API, simpler permission rules, and don't need raw SQL.
    use: supabase
  - reason: Both are self-hostable. Pick PocketBase for a single-binary zero-dependency deploy on one VPS. Pick Appwrite when you need managed cloud hosting, multiple runtimes for functions, and a larger team/community behind the platform.
    use: pocketbase
