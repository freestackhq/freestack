use_if:
  - You want a full identity provider (OIDC/SAML/passkeys) you can self-host long-term without per-MAU pricing cliffs. Zitadel's free cloud gives you 25 k MAU to validate, and the OSS binary means you can move to your own infra when margins matter — no rewrite, same API.
skip_if:
  - reason: Zitadel is an IdP you own; Clerk is a widget you rent. Clerk ships faster (drag-and-drop UI), but Zitadel gives you protocol-level control (custom OIDC scopes, SAML federation, machine-to-machine tokens) and no hard vendor ceiling. Pick Zitadel for multi-tenant B2B that will eventually need self-hosted auth; pick Clerk if you want login done in a day and won't self-host.
