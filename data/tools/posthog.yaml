use_if:
  - You need product analytics (funnels, retention, paths) *and* session replay *and* feature flags in one SDK instead of stitching three vendors together. The ~1M events/mo free tier is real — no credit card, no trial expiry.
  - "You need session replays, feature flags, A/B tests, AND funnels in one tool and refuse to duct-tape Mixpanel + LaunchDarkly + Hotjar together. PostHog's all-in-one surface means one SDK, one billing meter, one data model to reason about. vs Mixpanel/Amplitude: PostHog is warehouse-native and self-hostable; Mixpanel has slightly better collaboration UX for non-technical PMs but costs more per event and locks data in their cloud. vs Plausible/Umami: PostHog is for *product* analytics (who clicked what, where they churned); Plausible is for *traffic* analytics (pageviews, referrers) — use Plausible for your marketing site, PostHog for your app."
skip_if:
  - reason: "Sentry catches crashes; PostHog tells you *why users churned before they crashed*. Use both: Sentry for errors, PostHog for behavior."
    use: sentry
  - reason: Axiom is for structured backend logs; PostHog is for frontend product analytics. Different layers, not competitors.
    use: axiom
