use_if:
  - You're building a collaborative or realtime-first app (multiplayer editors, live dashboards, chat) in TypeScript and you want the database, server functions, and realtime subscriptions as one coherent system — no SQL, no ORM, no WebSocket plumbing.
skip_if:
  - reason: "Supabase Realtime: Supabase bolts realtime onto Postgres via change-data-capture; Convex is reactive from the ground up. Pick Convex when every query must live-update. Pick Supabase when you also need traditional REST endpoints and raw SQL escape hatches."
  - reason: "Firebase: Convex gives you TypeScript-native server functions with full ACID transactions; Firebase gives you a proprietary SDK with weaker consistency. Pick Convex for type-safe, transactional realtime; Firebase if you need its massive mobile ecosystem."
