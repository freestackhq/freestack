  - "You want good embeddings at low cost with the guarantee that you can download the same open weights and self-host later — no vendor lock-in on your vector pipeline. vs Voyage AI: Together embeddings are cheaper and open-weight (self-host escape hatch); Voyage has higher retrieval quality on benchmarks but is proprietary and pricier. vs OpenAI ada-002: Together's open models (e.g., BGE, E5) often match or beat ada-002 on retrieval tasks at lower per-token cost, and you own the weights."
