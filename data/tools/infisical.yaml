use_if:
  - You want secret management you can audit, fork, and self-host — no vendor can pull the rug on your secrets infra. Infisical's cloud free tier works like Doppler (env sync, integrations), but you also get the option to run it on your own box for compliance or air-gapped setups.
skip_if:
  - reason: Infisical is OSS-first — you can self-host, audit the code, and avoid proprietary lock-in. Doppler has slicker PaaS integrations (one-click Vercel sync) and a more polished CLI UX. Pick Infisical when sovereignty and self-host matter; pick Doppler when you just want secrets to flow to managed platforms with zero ops.
