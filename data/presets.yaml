# Home stack presets per situation. job matches a label in parts.yaml.
# A preset may hold tools nobody has checked yet: Home shows it as a "starter
# stack", says how many parts are checked, marks each row's state, and copied
# text says "not checked yet" for those parts. An empty list shows the
# situation's fallback (core parts and its Claim Once aisles).
school:
  - { job: Hosting, tool: cf-workers }
  - { job: Database, tool: neon }
  - { job: Sign-in, tool: clerk }
  - { job: Secrets, tool: doppler }
student:
  - { job: Hosting, tool: cf-workers }
  - { job: Database, tool: neon }
  - { job: Sign-in, tool: clerk }
  - { job: Cache, tool: upstash-redis }
indie:
  - { job: Hosting, tool: cf-workers }
  - { job: Database, tool: neon }
  - { job: Sign-in, tool: clerk }
startup: []
