<!doctype html>
<!--
  Source for public/brand/og.png (1200x630). Rendered by scripts/brand/og.mjs.
  Tokens and type follow DESIGN.md: Ink background, Archivo Expanded Black wordmark.
  Everything sits inside the central 1080x510 so cropped previews keep it whole.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1c2340;
        --label: #ffffff;
        --on-ink-muted: #c9cdd4;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: var(--ink);
        font-family: "Archivo", sans-serif;
        display: grid;
        place-items: center;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 48px;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .lockup svg {
        width: 144px;
        height: 144px;
      }
      .wordmark {
        color: var(--label);
        font-weight: 900;
        font-stretch: 125%;
        font-size: 124px;
        letter-spacing: -0.01em;
        line-height: 1;
        /* optical nudge: x-height sits low against the tag */
        padding-bottom: 10px;
      }
      .tagline {
        color: var(--on-ink-muted);
        font-size: 44px;
        line-height: 1.3;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="lockup">
        <!-- LOGO_MARK -->
        <span class="wordmark">freestack</span>
      </div>
      <p class="tagline">Free tools, student perks and APIs.<br />Limits and catches up front.</p>
    </main>
  </body>
</html>
